<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>چت آفلاین</title>
<meta name="theme-color" content="#0f172a">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Vazirmatn", Tahoma, sans-serif; background: #0f172a; color: #f1f5f9;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px;
    background: #1e293b; border-bottom: 1px solid #334155; }
  header a { color: #38bdf8; text-decoration: none; font-size: 15px; }
  header h1 { font-size: 15px; }
  #net { font-size: 12px; padding: 4px 10px; border-radius: 14px; border: 1px solid #334155; }
  #net.on { color: #4ade80; } #net.off { color: #facc15; }
  #setup { padding: 14px 16px; background: #1e293b; border-bottom: 1px solid #334155; font-size: 13px; line-height: 1.7; color: #94a3b8; }
  #setup select, #setup button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; font-size: 14px; font-family: inherit; }
  #setup select { background: #0f172a; color: #f1f5f9; border: 1px solid #334155; }
  #loadBtn { background: #38bdf8; color: #0f172a; border: none; font-weight: bold; }
  #loadBtn:disabled { opacity: .5; }
  #bar { height: 6px; background: #0f172a; border-radius: 3px; margin-top: 10px; overflow: hidden; display: none; }
  #bar div { height: 100%; width: 0; background: #38bdf8; }
  #status { margin-top: 8px; min-height: 18px; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 12px 14px; border-radius: 14px; font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #38bdf8; color: #0f172a; }
  .msg.ai { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
  .msg.sys { align-self: center; color: #64748b; font-size: 12px; text-align: center; }
  .bar2 { display: flex; gap: 8px; padding: 10px 12px; background: #1e293b; border-top: 1px solid #334155; }
  .bar2 input { flex: 1; padding: 12px 14px; border-radius: 20px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 16px; }
  .bar2 button { background: #38bdf8; border: none; border-radius: 20px; padding: 0 18px; color: #0f172a; font-weight: bold; }
  .bar2 button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <a href="index.html">→ بازگشت</a>
  <h1>چت آفلاین (مدل محلی)</h1>
  <span id="net" class="on">آنلاین</span>
</header>

<div id="setup">
  مدل روی خود گوشی اجرا می‌شود. بار اول باید با اینترنت دانلود شود؛ بعد از آن بدون اینترنت کار می‌کند.
  <select id="modelSel">
    <option value="onnx-community/Qwen2.5-0.5B-Instruct">Qwen2.5 0.5B (بهتر برای فارسی، سنگین‌تر)</option>
    <option value="onnx-community/SmolLM2-360M-Instruct">SmolLM2 360M (سبک‌تر، فارسی ضعیف‌تر)</option>
  </select>
  <button id="loadBtn" onclick="loadModel()">دانلود و فعال‌سازی مدل</button>
  <div id="bar"><div></div></div>
  <div id="status"></div>
</div>

<div id="messages"><div class="msg sys">گفتگوهای این بخش ذخیره نمی‌شوند و به سیستم آنلاین ربطی ندارند.</div></div>

<div class="bar2">
  <input type="text" id="inp" placeholder="پیام خود را بنویس..." disabled onkeydown="if(event.key==='Enter') send()">
  <button id="sendBtn" onclick="send()" disabled>ارسال</button>
</div>

<script>
  var gen = null, TS = null, busy = false, hist = [];
  var $ = function (id) { return document.getElementById(id); };

  function updNet() { var n = $('net'); n.className = navigator.onLine ? 'on' : 'off'; n.textContent = navigator.onLine ? 'آنلاین' : 'آفلاین'; }
  window.addEventListener('online', updNet); window.addEventListener('offline', updNet); updNet();

  function add(text, cls) {
    var d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
    $('messages').appendChild(d); $('messages').scrollTop = $('messages').scrollHeight; return d;
  }
  function setStatus(t) { $('status').textContent = t; }

  async function build(lib, id, device, dtype) {
    return lib.pipeline('text-generation', id, {
      device: device, dtype: dtype,
      progress_callback: function (p) {
        if (p.status === 'progress' && typeof p.progress === 'number') {
          $('bar').style.display = 'block';
          $('bar').firstElementChild.style.width = p.progress.toFixed(0) + '%';
          setStatus('در حال دانلود: ' + p.progress.toFixed(0) + '٪');
        }
      }
    });
  }

  async function loadModel() {
    var btn = $('loadBtn'); btn.disabled = true; setStatus('در حال آماده‌سازی...');
    try {
      try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
      var lib = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/+esm');
      TS = lib.TextStreamer;
      var id = $('modelSel').value;
      try {
        if (!navigator.gpu) throw new Error('no webgpu');
        gen = await build(lib, id, 'webgpu', 'q4f16');
      } catch (e1) {
        setStatus('اجرای کندتر (WASM)...');
        gen = await build(lib, id, 'wasm', 'q4');
      }
      $('bar').style.display = 'none';
      setStatus('✅ مدل آماده است. می‌توانی اینترنت را قطع کنی.');
      $('inp').disabled = false; $('sendBtn').disabled = false; $('modelSel').disabled = true;
    } catch (e) {
      console.error(e);
      setStatus('❌ مدل بارگذاری نشد: ' + (e && e.message ? e.message : e) + ' — بقیه برنامه سالم است.');
      btn.disabled = false;
    }
  }

  async function send() {
    var text = $('inp').value.trim();
    if (!text || !gen || busy) return;
    busy = true; $('sendBtn').disabled = true; $('inp').value = '';
    add(text, 'user'); hist.push({ role: 'user', content: text });
    var el = add('...', 'ai'), out = '';
    try {
      var msgs = [{ role: 'system', content: 'تو یک دستیار فارسی‌زبان هستی. کوتاه، ساده و مفید جواب بده.' }].concat(hist.slice(-6));
      var streamer = new TS(gen.tokenizer, {
        skip_prompt: true, skip_special_tokens: true,
        callback_function: function (t) { out += t; el.textContent = out; $('messages').scrollTop = $('messages').scrollHeight; }
      });
      await gen(msgs, { max_new_tokens: 256, do_sample: true, temperature: 0.6, repetition_penalty: 1.1, streamer: streamer });
      hist.push({ role: 'assistant', content: out });
    } catch (e) {
      console.error(e); el.textContent = 'خطا در تولید پاسخ. دوباره امتحان کن.';
    } finally { busy = false; $('sendBtn').disabled = false; }
  }
</script>
</body>
</html>
