<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>دستیار مهندسی نرم‌افزار</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Vazirmatn", Tahoma, sans-serif;
    background: #0f172a; color: #f1f5f9; min-height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .screen { display: none; flex: 1; flex-direction: column; height: 100vh; }
  .screen.active { display: flex; }

  #loginScreen { justify-content: center; align-items: center; padding: 24px; }
  .login-box { width: 100%; max-width: 360px; background: #1e293b; border-radius: 16px; padding: 28px 20px; }
  .login-box h1 { font-size: 20px; text-align: center; margin-bottom: 24px; color: #38bdf8; }
  .login-box input {
    width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px;
    border: 1px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 16px;
  }
  .login-box button {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: #38bdf8; color: #0f172a; font-weight: bold; font-size: 16px; margin-top: 8px;
  }
  .login-box button:disabled { opacity: 0.6; }
  #loginError { color: #f87171; font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }

  #homeScreen { padding: 20px 16px; overflow-y: auto; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .top-bar h2 { font-size: 18px; color: #38bdf8; }
  .icon-btn {
    background: none; border: 1px solid #334155; color: #94a3b8;
    padding: 6px 14px; border-radius: 20px; font-size: 13px;
  }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .menu-btn {
    background: #1e293b; border: 1px solid #334155; border-radius: 14px;
    padding: 20px 10px; text-align: center; color: #f1f5f9; font-size: 15px;
  }
  .menu-btn span { display: block; font-size: 26px; margin-bottom: 8px; }

  .inner-header {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px;
    background: #1e293b; border-bottom: 1px solid #334155;
  }
  .inner-header-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
  .back-btn { background: none; border: none; color: #38bdf8; font-size: 18px; flex-shrink: 0; }
  .inner-header h3 { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .small-btn { background: none; border: 1px solid #334155; color: #94a3b8; padding: 5px 10px; border-radius: 16px; font-size: 12px; flex-shrink:0; }

  #chatScreen { height: 100vh; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 12px 14px; border-radius: 14px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #38bdf8; color: #0f172a; }
  .msg.ai { align-self: flex-start; background: #1e293b; border: 1px solid #334155; }
  .msg.system { align-self: center; background: none; color: #64748b; font-size: 12px; }
  .msg-provider { font-size: 11px; color: #64748b; margin-top: 6px; }

  .chat-input-bar { display: flex; gap: 8px; padding: 10px 12px; background: #1e293b; border-top: 1px solid #334155; }
  .chat-input-bar input {
    flex: 1; padding: 12px 14px; border-radius: 20px; border: 1px solid #334155;
    background: #0f172a; color: #f1f5f9; font-size: 15px;
  }
  .chat-input-bar button {
    background: #38bdf8; border: none; border-radius: 20px; padding: 0 18px; color: #0f172a; font-weight: bold;
  }
  .chat-input-bar button:disabled { opacity: 0.5; }

  #codingScreen { height: 100vh; }
  #fileList { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .list-item {
    display: flex; align-items: center; gap: 10px;
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 14px; font-size: 15px; text-align: right; color: #f1f5f9;
  }
  .list-item span.icon { font-size: 18px; }
  .list-item.loading, .list-item.empty { justify-content: center; color: #64748b; background:none; border:none; }

  #fileViewBox { flex: 1; overflow-y: auto; padding: 12px; background: #0f172a; }
  #fileContentPre {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 12px; font-family: monospace; font-size: 12px; white-space: pre-wrap;
    word-break: break-word; direction: ltr; text-align: left; color: #e2e8f0;
    max-height: 40vh; overflow-y: auto; margin-bottom: 10px;
  }
  .truncate-warning { color: #facc15; font-size: 12px; margin-bottom: 10px; }

  #bugScreen { height: 100vh; }
  #bugForm { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  #bugForm label { font-size: 13px; color: #94a3b8; }
  #bugForm textarea {
    width: 100%; min-height: 100px; padding: 12px; border-radius: 10px;
    border: 1px solid #334155; background: #1e293b; color: #f1f5f9; font-size: 14px;
    font-family: inherit; resize: vertical;
  }
  #bugForm input[type=file] {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 10px; color: #94a3b8; font-size: 13px;
  }
  #imagePreview { max-width: 100%; border-radius: 10px; margin-top: 6px; display:none; }
  #bugSubmitBtn { background: #38bdf8; border: none; border-radius: 10px; padding: 14px; color: #0f172a; font-weight: bold; font-size: 15px; }
  #bugSubmitBtn:disabled { opacity: 0.5; }
  #bugResult {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 14px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; display: none;
  }

  #projectsScreen, #newProjectScreen, #projectDetailScreen, #buildAppScreen { height: 100vh; }
  #projectsList { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .project-item {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px;
  }
  .project-item h4 { font-size: 15px; color: #38bdf8; margin-bottom: 4px; }
  .project-item p { font-size: 13px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #newProjectForm { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  #newProjectForm label { font-size: 13px; color: #94a3b8; }
  #newProjectForm input, #newProjectForm textarea {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155;
    background: #1e293b; color: #f1f5f9; font-size: 14px; font-family: inherit;
  }
  #newProjectForm textarea { min-height: 70px; resize: vertical; }
  #saveProjectBtn { background: #38bdf8; border: none; border-radius: 10px; padding: 14px; color: #0f172a; font-weight: bold; font-size: 15px; }
  #saveProjectBtn:disabled { opacity: 0.5; }

  #projectDetailBox { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .detail-field label { font-size: 12px; color: #64748b; display:block; margin-bottom: 4px; }
  .detail-field div { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  .detail-actions { display: flex; gap: 10px; margin-top: 10px; }
  .detail-actions button {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155;
    background: #1e293b; color: #f1f5f9; font-size: 14px;
  }
  .detail-actions button.danger { color: #f87171; border-color: #f87171; }

  #buildAppForm { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  #buildAppForm label { font-size: 13px; color: #94a3b8; }
  #buildAppForm textarea {
    width: 100%; min-height: 90px; padding: 12px; border-radius: 10px;
    border: 1px solid #334155; background: #1e293b; color: #f1f5f9; font-size: 14px;
    font-family: inherit; resize: vertical;
  }
  #buildAppSubmitBtn { background: #38bdf8; border: none; border-radius: 10px; padding: 14px; color: #0f172a; font-weight: bold; font-size: 15px; }
  #buildAppSubmitBtn:disabled { opacity: 0.5; }
</style>
</head>
<body>

<div id="loginScreen" class="screen active">
  <div class="login-box">
    <h1>ورود به دستیار شخصی</h1>
    <input type="email" id="emailInput" placeholder="ایمیل" autocomplete="username">
    <input type="password" id="passwordInput" placeholder="رمز عبور" autocomplete="current-password">
    <button id="loginBtn" onclick="handleLogin()">ورود</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="homeScreen" class="screen">
  <div class="top-bar">
    <h2>دستیار مهندسی نرم‌افزار</h2>
    <button class="icon-btn" onclick="handleLogout()">خروج</button>
  </div>
  <div class="menu-grid">
    <button class="menu-btn" onclick="openProjects()"><span>📁</span>پروژه‌ها</button>
    <button class="menu-btn" onclick="openNewProject()"><span>➕</span>پروژه جدید</button>
    <button class="menu-btn" onclick="showScreen('chatScreen')"><span>💬</span>گفتگو با AI</button>
    <button class="menu-btn" onclick="openCoding()"><span>💻</span>کدنویسی</button>
    <button class="menu-btn" onclick="openBugDoctor()"><span>🐞</span>رفع باگ</button>
    <button class="menu-btn" onclick="openBuildApp()"><span>🏗️</span>ساخت اپ</button>
    <button class="menu-btn" onclick="comingSoon()"><span>📄</span>فایل‌ها</button>
    <button class="menu-btn" onclick="comingSoon()"><span>⚙️</span>تنظیمات</button>
  </div>
</div>

<div id="chatScreen" class="screen">
  <div class="inner-header">
    <div class="inner-header-left">
      <button class="back-btn" onclick="showScreen('homeScreen')">→ بازگشت</button>
      <h3>گفتگو با AI</h3>
    </div>
    <button class="small-btn" onclick="clearHistory()">پاک کردن</button>
  </div>
  <div id="messages"><div class="msg system">در حال بارگذاری تاریخچه...</div></div>
  <div class="chat-input-bar">
    <input type="text" id="chatInput" placeholder="پیام خود را بنویس..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">ارسال</button>
  </div>
</div>

<div id="codingScreen" class="screen">
  <div class="inner-header">
    <div class="inner-header-left">
      <button class="back-btn" id="codingBackBtn" onclick="codingBack()">→ بازگشت</button>
      <h3 id="codingTitle">پروژه‌ها</h3>
    </div>
  </div>
  <div id="fileList"></div>
  <div id="fileViewBox" style="display:none;">
    <div class="truncate-warning" id="truncateWarning" style="display:none;">⚠️ فایل بزرگ است، فقط بخش ابتدایی برای AI ارسال می‌شود.</div>
    <div id="fileContentPre"></div>
  </div>
  <div class="chat-input-bar" id="fileAskBar" style="display:none;">
    <input type="text" id="fileAskInput" placeholder="درباره این فایل بپرس..." onkeydown="if(event.key==='Enter') askAboutFile()">
    <button id="fileAskBtn" onclick="askAboutFile()">ارسال</button>
  </div>
</div>

<div id="bugScreen" class="screen">
  <div class="inner-header">
    <div class="inner-header-left">
      <button class="back-btn" onclick="showScreen('homeScreen')">→ بازگشت</button>
      <h3>رفع باگ</h3>
    </div>
  </div>
  <div id="bugForm">
    <div><label>متن خطا (Error) را اینجا Paste کن</label><textarea id="bugErrorText" placeholder="مثلاً: TypeError: Cannot read property 'name' of undefined ..."></textarea></div>
    <div><label>کد مرتبط (اختیاری)</label><textarea id="bugCodeText" placeholder="اگه بخشی از کد رو داری که فکر می‌کنی مرتبطه، اینجا بذار"></textarea></div>
    <div><label>اسکرین‌شات خطا (اختیاری)</label>
      <input type="file" id="bugImageInput" accept="image/*" onchange="previewBugImage(event)">
      <img id="imagePreview">
    </div>
    <button id="bugSubmitBtn" onclick="analyzeBug()">تحلیل کن</button>
    <div id="bugResult"></div>
  </div>
</div>

<div id="projectsScreen" class="screen">
  <div class="inner-header">
    <div class="inner-header-left">
      <button class="back-btn" onclick="showScreen('homeScreen')">→ بازگشت</button>
      <h3>پروژه‌ها</h3>
    </div>
    <button class="small-btn" onclick="openNewProject()">+ جدید</button>
  </div>
  <div id="projectsList"></div>
</div>

<div id="newProjectScreen" class="screen">
  <div class="inner-header">
    <div class="inner-header-left">
      <button class="back-btn" onclick="showScreen('homeScreen')">→ بازگشت</button>
      <h3 id="newProjectTitle">پروژه جدید</h3>
    </div>
  </div>
  <div id="newProjectForm">
    <div><label>اسم پروژه *</label><input type="text" id="projName" placeholder="مثلاً: فروشگاه طلوع کالا"></div>
    <div><label>توضیحات</label><textarea id="projDesc" placeholder="این پروژه چیه؟"></textarea></div>
    <div><label>اهداف</label><textarea id="projGoals" placeholder="هدف اصلی این پروژه چیه؟"></textarea></div>
    <div><label>Tech Stack</label><input type="text" id="projStack" placeholder="مثلاً: HTML/CSS/JS + Supabase + GitHub Pages"></div>
    <button id="saveProjectBtn" onclick="saveProject()">ذخیره پروژه</button>
  </div>
</div>

<div id="projectDetailScreen" class="screen">
  <div class="inner-header">
    <div class="inner-header-left">
      <button class="back-btn" onclick="openProjects()">→ بازگشت</button>
      <h3 id="detailTitle">پروژه</h3>
    </div>
  </div>
  <div id="projectDetailBox">
    <div class="detail-field"><label>توضیحات</label><div id="detailDesc"></div></div>
    <div class="detail-field"><label>اهداف</label><div id="detailGoals"></div></div>
    <div class="detail-field"><label>Tech Stack</label><div id="detailStack"></div></div>
    <div class="detail-field"><label>تاریخ ایجاد</label><div id="detailCreated"></div></div>
    <div class="detail-actions">
      <button onclick="editProject()">ویرایش</button>
      <button class="danger" onclick="deleteProject()">حذف</button>
    </div>
  </div>
</div>

<div id="buildAppScreen" class="screen">
  <div class="inner-header">
    <div class="inner-header-left">
      <button class="back-btn" onclick="showScreen('homeScreen')">→ بازگشت</button>
      <h3>ساخت اپ</h3>
    </div>
  </div>
  <div id="buildAppForm">
    <div>
      <label>ایده‌ات رو توی یک یا چند جمله بنویس</label>
      <textarea id="buildAppIdea" placeholder="مثلاً: می‌خوام یک اپ بسازم که عکس فاکتور رو بگیره و کالاها رو استخراج کنه"></textarea>
    </div>
    <button id="buildAppSubmitBtn" onclick="analyzeBuildApp()">شروع کن</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://jucvdutfxazetlmlezka.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_TpUs6076LA1x75TaFGTnZg_rxj0TdI5";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const AI_CHAT_URL = `${SUPABASE_URL}/functions/v1/ai-chat`;
  const GITHUB_FILES_URL = `${SUPABASE_URL}/functions/v1/github-files`;
  const MAX_FILE_CHARS = 12000;

  let historyLoaded = false;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'chatScreen') loadChatHistory();
  }

  async function checkSession() {
    const { data } = await supabaseClient.auth.getSession();
    showScreen(data.session ? 'homeScreen' : 'loginScreen');
  }

  async function handleLogin() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const errorBox = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errorBox.textContent = '';
    if (!email || !password) { errorBox.textContent = 'لطفاً ایمیل و رمز عبور را وارد کنید'; return; }
    btn.disabled = true; btn.textContent = 'در حال ورود...';
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = 'ورود';
    if (error) { errorBox.textContent = 'ایمیل یا رمز عبور اشتباه است'; return; }
    showScreen('homeScreen');
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
    historyLoaded = false;
    showScreen('loginScreen');
  }

  function comingSoon() { alert('این بخش در مرحله بعد ساخته می‌شود 🙂'); }

  async function getToken() {
    const { data } = await supabaseClient.auth.getSession();
    return data.session?.access_token;
  }

  function addMessage(text, cls, provider) {
    const box = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    if (provider) {
      const p = document.createElement('div');
      p.className = 'msg-provider';
      p.textContent = 'منبع: ' + provider;
      div.appendChild(p);
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  async function loadChatHistory() {
    if (historyLoaded) return;
    historyLoaded = true;
    const box = document.getElementById('messages');
    const { data, error } = await supabaseClient
      .from('conversation_log').select('role, content, created_at')
      .is('project_id', null).order('created_at', { ascending: true });
    box.innerHTML = '';
    if (error) { addMessage('خطا در بارگذاری تاریخچه: ' + error.message, 'system'); return; }
    if (!data || data.length === 0) { addMessage('سلام! هر سؤال کدنویسی یا ایده‌ای داری بپرس.', 'system'); return; }
    data.forEach(row => addMessage(row.content, row.role === 'user' ? 'user' : 'ai'));
  }

  async function saveMessage(role, content) {
    try { await supabaseClient.from('conversation_log').insert({ project_id: null, role, content }); }
    catch (e) { console.error('save failed', e); }
  }

  async function clearHistory() {
    if (!confirm('کل تاریخچه گفتگو پاک بشه؟')) return;
    await supabaseClient.from('conversation_log').delete().is('project_id', null);
    historyLoaded = false;
    loadChatHistory();
  }

  async function callAiChat(message, mode, image) {
    const token = await getToken();
    const res = await fetch(AI_CHAT_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ message, mode, image }),
    });
    return res.json();
  }

  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, 'user'); saveMessage('user', text);
    input.value = ''; sendBtn.disabled = true;
    const loadingMsg = addMessage('در حال فکر کردن...', 'ai');
    try {
      const data = await callAiChat(text);
      loadingMsg.remove();
      if (data.error) { addMessage('خطا: ' + data.error, 'system'); }
      else { addMessage(data.reply, 'ai', data.provider); saveMessage('ai', data.reply); }
    } catch (err) { loadingMsg.remove(); addMessage('خطا در اتصال به سرور. دوباره امتحان کن.', 'system'); }
    finally { sendBtn.disabled = false; }
  }

  let codingState = { view: 'repos', repo: null, path: '' };
  function openCoding() { codingState = { view: 'repos', repo: null, path: '' }; showScreen('codingScreen'); loadRepos(); }
  async function githubCall(action, repo, path) {
    const token = await getToken();
    const res = await fetch(GITHUB_FILES_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ action, repo, path }),
    });
    return res.json();
  }
  function setFileListLoading() { document.getElementById('fileList').innerHTML = '<div class="list-item loading">در حال بارگذاری...</div>'; }
  async function loadRepos() {
    document.getElementById('fileViewBox').style.display = 'none';
    document.getElementById('fileAskBar').style.display = 'none';
    document.getElementById('fileList').style.display = 'flex';
    document.getElementById('codingTitle').textContent = 'پروژه‌ها';
    document.getElementById('codingBackBtn').textContent = '→ بازگشت';
    setFileListLoading();
    const { result, error } = await githubCall('listRepos');
    const box = document.getElementById('fileList');
    if (error) { box.innerHTML = `<div class="list-item empty">خطا: ${error}</div>`; return; }
    if (!result || result.length === 0) { box.innerHTML = '<div class="list-item empty">هیچ ریپویی پیدا نشد</div>'; return; }
    box.innerHTML = '';
    result.forEach(r => {
      const div = document.createElement('div');
      div.className = 'list-item';
      div.innerHTML = `<span class="icon">📦</span><span>${r.name}${r.private ? ' 🔒' : ''}</span>`;
      div.onclick = () => openRepo(r.name);
      box.appendChild(div);
    });
  }
  function openRepo(repoName) { codingState = { view: 'files', repo: repoName, path: '' }; loadFiles(); }
  async function loadFiles() {
    document.getElementById('fileViewBox').style.display = 'none';
    document.getElementById('fileAskBar').style.display = 'none';
    document.getElementById('fileList').style.display = 'flex';
    document.getElementById('codingTitle').textContent = codingState.repo + (codingState.path ? ' / ' + codingState.path : '');
    document.getElementById('codingBackBtn').textContent = '→ بازگشت';
    setFileListLoading();
    const { result, error } = await githubCall('listFiles', codingState.repo, codingState.path);
    const box = document.getElementById('fileList');
    if (error) { box.innerHTML = `<div class="list-item empty">خطا: ${error}</div>`; return; }
    if (!result || result.length === 0) { box.innerHTML = '<div class="list-item empty">پوشه خالی است</div>'; return; }
    box.innerHTML = '';
    const items = Array.isArray(result) ? result : [result];
    items.sort((a, b) => (a.type === b.type) ? a.name.localeCompare(b.name) : (a.type === 'dir' ? -1 : 1));
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'list-item';
      const icon = item.type === 'dir' ? '📁' : '📄';
      div.innerHTML = `<span class="icon">${icon}</span><span>${item.name}</span>`;
      div.onclick = () => { if (item.type === 'dir') { codingState.path = item.path; loadFiles(); } else { openFile(item.path); } };
      box.appendChild(div);
    });
  }
  async function openFile(filePath) {
    codingState.view = 'file'; codingState.filePath = filePath;
    document.getElementById('fileList').style.display = 'none';
    document.getElementById('fileViewBox').style.display = 'block';
    document.getElementById('fileAskBar').style.display = 'flex';
    document.getElementById('codingTitle').textContent = filePath.split('/').pop();
    document.getElementById('fileContentPre').textContent = 'در حال بارگذاری فایل...';
    document.getElementById('truncateWarning').style.display = 'none';
    const { result, error } = await githubCall('getFile', codingState.repo, filePath);
    if (error) { document.getElementById('fileContentPre').textContent = 'خطا: ' + error; return; }
    codingState.fullContent = result.content;
    document.getElementById('fileContentPre').textContent = result.content;
    if (result.content.length > MAX_FILE_CHARS) document.getElementById('truncateWarning').style.display = 'block';
  }
  function codingBack() {
    if (codingState.view === 'file') { codingState.view = 'files'; loadFiles(); }
    else if (codingState.view === 'files') {
      if (codingState.path) { const parts = codingState.path.split('/'); parts.pop(); codingState.path = parts.join('/'); loadFiles(); }
      else { codingState = { view: 'repos', repo: null, path: '' }; loadRepos(); }
    } else { showScreen('homeScreen'); }
  }
  async function askAboutFile() {
    const input = document.getElementById('fileAskInput');
    const btn = document.getElementById('fileAskBtn');
    const question = input.value.trim();
    if (!question) return;
    let fileContent = codingState.fullContent || '';
    let truncated = false;
    if (fileContent.length > MAX_FILE_CHARS) { fileContent = fileContent.slice(0, MAX_FILE_CHARS); truncated = true; }
    const fullMessage = `فایل: ${codingState.filePath} (پروژه: ${codingState.repo})` +
      (truncated ? '\n(توجه: فقط بخش ابتدایی فایل ارسال شده چون فایل بزرگ است)' : '') +
      `\n\nمحتوای فایل:\n\`\`\`\n${fileContent}\n\`\`\`\n\nسؤال: ${question}`;
    input.value = ''; btn.disabled = true;
    const warningBox = document.getElementById('fileContentPre');
    const oldText = warningBox.textContent;
    warningBox.textContent = 'در حال تحلیل توسط AI...\n\n' + oldText;
    try {
      const data = await callAiChat(fullMessage);
      warningBox.textContent = oldText;
      if (data.error) { alert('خطا: ' + data.error); }
      else {
        showScreen('chatScreen');
        addMessage(`[درباره ${codingState.filePath}] ${question}`, 'user');
        saveMessage('user', `[درباره ${codingState.filePath}] ${question}`);
        addMessage(data.reply, 'ai', data.provider);
        saveMessage('ai', data.reply);
      }
    } catch (e) { warningBox.textContent = oldText; alert('خطا در اتصال به سرور'); }
    finally { btn.disabled = false; }
  }

  let bugImageBase64 = null;
  function openBugDoctor() {
    document.getElementById('bugErrorText').value = '';
    document.getElementById('bugCodeText').value = '';
    document.getElementById('bugImageInput').value = '';
    document.getElementById('imagePreview').style.display = 'none';
    document.getElementById('bugResult').style.display = 'none';
    document.getElementById('bugResult').textContent = '';
    bugImageBase64 = null;
    showScreen('bugScreen');
  }
  function previewBugImage(event) {
    const file = event.target.files[0];
    if (!file) { bugImageBase64 = null; document.getElementById('imagePreview').style.display = 'none'; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      bugImageBase64 = dataUrl.split(',')[1];
      const img = document.getElementById('imagePreview');
      img.src = dataUrl; img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
  async function analyzeBug() {
    const errorText = document.getElementById('bugErrorText').value.trim();
    const codeText = document.getElementById('bugCodeText').value.trim();
    const btn = document.getElementById('bugSubmitBtn');
    const resultBox = document.getElementById('bugResult');
    if (!errorText && !bugImageBase64) { alert('حداقل متن خطا یا یک اسکرین‌شات لازم است'); return; }
    const promptTemplate =
`تو الان نقش "Bug Doctor" داری. دقیقاً با همین ساختار و همین هدرهای فارسی جواب بده، هیچ بخشی رو حذف نکن:

مشکل:
(خلاصه دقیق مشکل)

علت:
(اگر چند علت محتمل وجود دارد، از محتمل‌ترین به کم‌احتمال‌ترین شماره‌گذاری و مرتب کن)

شواهد:
(چرا این علت را محتمل می‌دانی)

راه‌حل:
(دقیق و عملی، قابل اجرا)

فایل‌های تغییریافته:
(اگر از روی کد ارائه‌شده مشخصه چه فایلی باید تغییر کند)

ریسک:
(این تغییر چه چیز دیگری را ممکن است تحت تأثیر قرار دهد)

برنامه تست:
(بعد از اعمال تغییر، چطور تست کنم که درست شده)

اگر اطلاعات کافی نداری، حدس نزن؛ در بخش "شواهد" دقیقاً بگو چه اطلاعات بیشتری لازم داری.

---
اطلاعات ارائه شده توسط کاربر:

متن خطا:
${errorText || '(ارائه نشده — به عکس ضمیمه نگاه کن)'}
${codeText ? '\nکد مرتبط:\n```\n' + codeText + '\n```' : ''}`;
    btn.disabled = true; resultBox.style.display = 'block'; resultBox.textContent = 'در حال تحلیل...';
    try {
      const mode = bugImageBase64 ? 'vision' : undefined;
      const data = await callAiChat(promptTemplate, mode, bugImageBase64);
      if (data.error) { resultBox.textContent = 'خطا: ' + data.error; }
      else {
        resultBox.textContent = data.reply + '\n\n— منبع: ' + data.provider;
        saveMessage('user', '[رفع باگ] ' + (errorText || '(عکس ارسال شد)'));
        saveMessage('ai', data.reply);
      }
    } catch (e) { resultBox.textContent = 'خطا در اتصال به سرور. دوباره امتحان کن.'; }
    finally { btn.disabled = false; }
  }

  let currentProjectId = null;
  function openProjects() { showScreen('projectsScreen'); loadProjects(); }
  async function loadProjects() {
    const box = document.getElementById('projectsList');
    box.innerHTML = '<div class="list-item loading">در حال بارگذاری...</div>';
    const { data, error } = await supabaseClient
      .from('projects').select('id, name, description').order('created_at', { ascending: false });
    if (error) { box.innerHTML = `<div class="list-item empty">خطا: ${error.message}</div>`; return; }
    if (!data || data.length === 0) { box.innerHTML = '<div class="list-item empty">هنوز پروژه‌ای ثبت نشده. از دکمه «+ جدید» شروع کن.</div>'; return; }
    box.innerHTML = '';
    data.forEach(p => {
      const div = document.createElement('div');
      div.className = 'project-item';
      div.innerHTML = `<h4>${p.name}</h4><p>${p.description || 'بدون توضیحات'}</p>`;
      div.onclick = () => openProjectDetail(p.id);
      box.appendChild(div);
    });
  }
  function openNewProject() {
    currentProjectId = null;
    document.getElementById('newProjectTitle').textContent = 'پروژه جدید';
    document.getElementById('projName').value = '';
    document.getElementById('projDesc').value = '';
    document.getElementById('projGoals').value = '';
    document.getElementById('projStack').value = '';
    showScreen('newProjectScreen');
  }
  async function saveProject() {
    const name = document.getElementById('projName').value.trim();
    const description = document.getElementById('projDesc').value.trim();
    const goals = document.getElementById('projGoals').value.trim();
    const tech_stack = document.getElementById('projStack').value.trim();
    const btn = document.getElementById('saveProjectBtn');
    if (!name) { alert('اسم پروژه لازم است'); return; }
    btn.disabled = true; btn.textContent = 'در حال ذخیره...';
    try {
      let error;
      if (currentProjectId) {
        ({ error } = await supabaseClient.from('projects').update({ name, description, goals, tech_stack }).eq('id', currentProjectId));
      } else {
        ({ error } = await supabaseClient.from('projects').insert({ name, description, goals, tech_stack }));
      }
      if (error) { alert('خطا: ' + error.message); }
      else { openProjects(); }
    } finally { btn.disabled = false; btn.textContent = 'ذخیره پروژه'; }
  }
  let currentProjectData = null;
  async function openProjectDetail(id) {
    currentProjectId = id;
    showScreen('projectDetailScreen');
    document.getElementById('detailTitle').textContent = 'در حال بارگذاری...';
    const { data, error } = await supabaseClient.from('projects').select('*').eq('id', id).single();
    if (error) { document.getElementById('detailTitle').textContent = 'خطا'; return; }
    currentProjectData = data;
    document.getElementById('detailTitle').textContent = data.name;
    document.getElementById('detailDesc').textContent = data.description || '—';
    document.getElementById('detailGoals').textContent = data.goals || '—';
    document.getElementById('detailStack').textContent = data.tech_stack || '—';
    document.getElementById('detailCreated').textContent = new Date(data.created_at).toLocaleDateString('fa-IR');
  }
  function editProject() {
    if (!currentProjectData) return;
    document.getElementById('newProjectTitle').textContent = 'ویرایش پروژه';
    document.getElementById('projName').value = currentProjectData.name || '';
    document.getElementById('projDesc').value = currentProjectData.description || '';
    document.getElementById('projGoals').value = currentProjectData.goals || '';
    document.getElementById('projStack').value = currentProjectData.tech_stack || '';
    showScreen('newProjectScreen');
  }
  async function deleteProject() {
    if (!currentProjectId) return;
    if (!confirm('این پروژه کامل حذف بشه؟ این کار قابل برگشت نیست.')) return;
    const { error } = await supabaseClient.from('projects').delete().eq('id', currentProjectId);
    if (error) { alert('خطا: ' + error.message); return; }
    openProjects();
  }

  function openBuildApp() {
    document.getElementById('buildAppIdea').value = '';
    showScreen('buildAppScreen');
  }

  async function analyzeBuildApp() {
    const idea = document.getElementById('buildAppIdea').value.trim();
    if (!idea) { alert('اول ایده‌ات رو بنویس'); return; }

    const message = `می‌خوام این ایده رو بسازم: ${idea}

لطفاً مثل یک همکار کدنویس قدم‌به‌قدم پیش برو: اگه سؤال ضروری داری فقط یکی بپرس، وگرنه مستقیم برو سراغ کد واقعی و اولین فایل رو کامل بده و بگو کجا بذارمش.`;

    showScreen('chatScreen');
    addMessage(message, 'user');
    saveMessage('user', message);
    const loadingMsg = addMessage('در حال فکر کردن...', 'ai');

    try {
      const data = await callAiChat(message);
      loadingMsg.remove();
      if (data.error) { addMessage('خطا: ' + data.error, 'system'); }
      else { addMessage(data.reply, 'ai', data.provider); saveMessage('ai', data.reply); }
    } catch (e) {
      loadingMsg.remove();
      addMessage('خطا در اتصال به سرور. دوباره امتحان کن.', 'system');
    }
  }

  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js'); }
  checkSession();
</script>
</body>
</html>
